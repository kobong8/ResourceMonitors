# ──────────────────────────────────────────────────────────
# Resource Monitor Agent 설정 파일
# ──────────────────────────────────────────────────────────

hub:
  # Hub 서버 주소 (http://허브IP:포트)
  url: "http://192.168.1.100:5000"
  # Hub와 공유하는 API 키 (hub/config.yaml 의 값과 동일해야 함)
  api_key: "CHANGE_THIS_TO_A_STRONG_RANDOM_KEY"

agent:
  # 빈 문자열이면 컴퓨터의 hostname을 자동으로 사용
  hostname: ""
  # Hub에 데이터를 전송하는 주기 (초)
  report_interval_seconds: 30

# ──────────────────────────────────────────────────────────
# 아래 monitoring 설정은 Hub에서 동기화됩니다.
# Hub에 연결할 수 없을 때 아래 설정이 폴백으로 사용됩니다.
# ──────────────────────────────────────────────────────────
monitoring:
  # 실행 중인지 확인할 프로그램 목록
  programs_to_check_running:
    - name: "Chrome"
      process: "chrome"
    - name: "Visual Studio Code"
      process: "code"
    - name: "Python"
      process: "python"
    - name: "Jupyter"
      process: "jupyter"

  # 설치 여부를 확인할 프로그램 목록
  # check_command: 프로그램이 설치돼 있으면 종료코드 0을 반환하는 명령어
  programs_to_check_installed:
    - name: "Python"
      check_command: "python --version"
    - name: "CUDA (nvcc)"
      check_command: "nvcc --version"
    - name: "Docker"
      check_command: "docker --version"
    - name: "Git"
      check_command: "git --version"
    - name: "Node.js"
      check_command: "node --version"
