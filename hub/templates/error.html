<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오류 {{ code }} – Resource Monitor</title>
<style>
  :root {
    --primary: #3182ce;
    --offline: #e53e3e;
    --text:    #1a202c;
    --sub:     #718096;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0f2f5; color: var(--text);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .box {
    background: #fff; border-radius: 12px;
    border: 1px solid #e2e8f0; box-shadow: 0 4px 20px rgba(0,0,0,.1);
    padding: 48px 40px; text-align: center; max-width: 460px; width: 90%;
  }
  .code { font-size: 80px; font-weight: 800; color: var(--offline);
          line-height: 1; margin-bottom: 12px; }
  .message { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  .detail  { font-size: 14px; color: var(--sub); margin-bottom: 28px; }
  .btn {
    display: inline-block; padding: 10px 24px; border-radius: 8px;
    background: var(--primary); color: #fff; text-decoration: none;
    font-size: 14px; font-weight: 600; transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  {% if code == 403 %}
  .code { color: #d69e2e; }
  {% endif %}
</style>
</head>
<body>
<div class="box">
  <div class="code">{{ code }}</div>
  <div class="message">{{ message }}</div>
  <div class="detail">{{ detail }}</div>
  <a href="/" class="btn">대시보드로 돌아가기</a>
</div>
</body>
</html>
